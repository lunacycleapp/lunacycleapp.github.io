function setLang(lang) {
  const t = T[lang];
  document.getElementById('header-sub').textContent = t.headerSub;
  document.getElementById('updated-date').textContent = t.updated;
  let html = `<div class="highlight">${t.highlight}</div>`;
  for (const s of t.sections) {
    html += `<h2>${s.title}</h2>${s.body}`;
  }
  document.getElementById('policy-content').innerHTML = html;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
}
